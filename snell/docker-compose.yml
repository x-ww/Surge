services:
  snell:
    # 预构建镜像（推荐）：GitHub Actions 自动构建并推送到 GHCR，无需本地构建
    image: ghcr.io/x-ww/snell:6
    # 本地构建（二选一：把上面 image 注释掉，打开下面两行）
    # build: .
    # image: my-snell:v6
    container_name: snell
    restart: unless-stopped
    # host 模式：随机端口直接占用宿主机端口，无需做端口映射
    network_mode: host
    environment:
      # 留空则首次启动自动生成随机端口和随机 PSK（去日志里看）；
      # 想固定就填上，例如 SNELL_PORT=6160
      - SNELL_PORT=
      - SNELL_PSK=
    volumes:
      # 持久化自动生成的配置：重启不变；删除该卷后下次启动重新生成
      - snell-data:/app/data
      # 使用自己的配置文件（二选一，会覆盖自动生成）：
      # - ./snell-server.conf:/app/snell-server.conf:ro

volumes:
  snell-data:
