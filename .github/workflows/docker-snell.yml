name: 构建 Snell Docker 镜像

on:
  push:
    branches: [main]
    paths:
      - 'Snell/**'
      - '.github/workflows/docker-snell.yml'
      # 只改 README 时不触发构建（! 排除项必须放在肯定项之后）
      - '!Snell/README.md'
  schedule:
    - cron: '0 3 * * *'  # 每天 03:00 UTC 检查官方是否有新版
  workflow_dispatch:
    inputs:
      snell_version:
        description: '锁定 Snell 版本（留空则自动用官方最新 v6）'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析 Snell 版本
        id: version
        env:
          PIN: ${{ inputs.snell_version }}
        run: |
          if [ -n "$PIN" ]; then
            V="$PIN"
            PINNED=true
          else
            # 与 Dockerfile 共用同一个解析脚本，避免两处逻辑跑偏
            V=$(sh Snell/resolve-version.sh amd64)
            PINNED=false
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "Snell version: $V (pinned=$PINNED)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 定时任务：该版本已构建过就跳过，避免重复构建
      - name: 检查该版本是否已构建
        id: check
        if: github.event_name == 'schedule'
        run: |
          if docker manifest inspect ghcr.io/x-ww/snell:${{ steps.version.outputs.version }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "版本 ${{ steps.version.outputs.version }} 已存在，跳过构建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备镜像 tags
        id: tags
        run: |
          TAGS="ghcr.io/x-ww/snell:${{ steps.version.outputs.version }}"
          # 手动锁定旧版本时，不移动 6 这个 tag
          if [ "${{ steps.version.outputs.pinned }}" != "true" ]; then
            TAGS="$TAGS,ghcr.io/x-ww/snell:6"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Tags: $TAGS"

      - name: 构建并推送
        if: github.event_name != 'schedule' || steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./Snell
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SNELL_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          # 复用上一轮的层缓存：apt 安装和下载层在 Snell 升版时基本不变，
          # 命中后每天定时构建（arm64 走 QEMU）能省下数分钟。
          # mode=max 让中间阶段的层也进缓存，否则 download 阶段存不下来。
          cache-from: type=gha
          cache-to: type=gha,mode=max
