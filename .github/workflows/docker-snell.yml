# 维护说明：Muse 的 GitHub App 没有 Workflows 权限，此文件需手动在网页端修改，
# 或使用 vault 中的 PAT（custom.github 连接）经 API 修改。
name: 构建 Snell Docker 镜像

on:
  push:
    branches: [main]
    paths:
      - 'Snell/**'
      - '.github/workflows/docker-snell.yml'
  schedule:
    - cron: '0 3 * * 0'  # 每周日 03:00 UTC 检查官方是否有新版
  workflow_dispatch:
    inputs:
      snell_version:
        description: '锁定 Snell 版本（留空则自动用官方最新 v6）'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析 Snell 版本
        id: version
        run: |
          PINNED=false
          if [ -n "${{ inputs.snell_version }}" ]; then
            V="${{ inputs.snell_version }}"
            PINNED=true
          else
            VERSIONS=$(curl -sL --max-time 20 https://kb.nssurge.com/surge-knowledge-base/release-notes/snell.md \
              | grep -oE 'snell-server-v[0-9][0-9a-z.]*-linux-amd64\.zip' \
              | sed -E 's/^snell-server-v//; s/-linux-.*$//' \
              | grep -E '^6\.' | sort -u)
            V=$(echo "$VERSIONS" | grep -E '^[0-9.]+$' | sort -V | tail -1)
            [ -n "$V" ] || V=$(echo "$VERSIONS" | sort -V | tail -1)
          fi
          [ -n "$V" ] || { echo "无法解析 Snell 版本"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "Snell version: $V (pinned=$PINNED)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 定时任务：该版本已构建过就跳过，避免重复构建
      - name: 检查该版本是否已构建
        id: check
        if: github.event_name == 'schedule'
        run: |
          if docker manifest inspect ghcr.io/x-ww/snell:${{ steps.version.outputs.version }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "版本 ${{ steps.version.outputs.version }} 已存在，跳过构建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备镜像 tags
        id: tags
        run: |
          TAGS="ghcr.io/x-ww/snell:${{ steps.version.outputs.version }}"
          # 手动锁定旧版本时，不移动 6 这个 tag
          if [ "${{ steps.version.outputs.pinned }}" != "true" ]; then
            TAGS="$TAGS,ghcr.io/x-ww/snell:6"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Tags: $TAGS"

      - name: 构建并推送
        if: github.event_name != 'schedule' || steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./Snell
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SNELL_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
