name: 构建 Snell Docker 镜像

on:
  push:
    branches: [main]
    paths:
      - 'Snell/**'
      - '.github/workflows/docker-snell.yml'
      # 只改 README 时不触发构建（! 排除项必须放在肯定项之后）
      - '!Snell/README.md'
  schedule:
    - cron: '0 3 * * *'  # 每天 03:00 UTC 检查官方是否有新版
  workflow_dispatch:
    inputs:
      snell_version:
        description: '锁定 Snell 版本（留空则自动用官方最新 v6）'
        required: false
        default: ''

permissions:
  contents: write  # 发 GitHub Release 需要写权限
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 解析 Snell 版本
        id: version
        env:
          PIN: ${{ inputs.snell_version }}
        run: |
          if [ -n "$PIN" ]; then
            V="$PIN"
            PINNED=true
          else
            # 与 Dockerfile 共用同一个解析脚本，避免两处逻辑跑偏
            V=$(sh Snell/resolve-version.sh amd64)
            PINNED=false
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "Snell version: $V (pinned=$PINNED)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 定时任务：该版本已构建过就跳过，避免重复构建
      - name: 检查该版本是否已构建
        id: check
        if: github.event_name == 'schedule'
        run: |
          if docker manifest inspect ghcr.io/x-ww/snell:${{ steps.version.outputs.version }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "版本 ${{ steps.version.outputs.version }} 已存在，跳过构建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备镜像 tags
        id: tags
        run: |
          TAGS="ghcr.io/x-ww/snell:${{ steps.version.outputs.version }}"
          # 手动锁定旧版本时，不移动 6 这个 tag
          if [ "${{ steps.version.outputs.pinned }}" != "true" ]; then
            TAGS="$TAGS,ghcr.io/x-ww/snell:6"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Tags: $TAGS"

      - name: 构建并推送
        if: github.event_name != 'schedule' || steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./Snell
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SNELL_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          # 复用上一轮的层缓存：apt 安装和下载层在 Snell 升版时基本不变，
          # 命中后每天定时构建（arm64 走 QEMU）能省下数分钟。
          # mode=max 让中间阶段的层也进缓存，否则 download 阶段存不下来。
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 清理历史预发布 tag（rc/beta 等），只保留正式版与 6 浮动 tag。
      # 走 GHCR 的 Docker Registry API（比 GitHub Packages REST 端点稳定），
      # 需要 packages:write 权限。失败不阻塞构建，仅提示。
      - name: 清理旧预发布 tag
        if: github.event_name != 'schedule' || steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -u
          CURRENT="${{ steps.version.outputs.version }}"
          REPO="x-ww/snell"
          echo "当前版本: $CURRENT（永不删除）"

          # 用 GITHUB_TOKEN 换一个带 push/delete 权限的 registry token
          RTOKEN=$(curl -fsSL --max-time 20 \
            -u "$ACTOR:$GH_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO}:pull,push,delete" \
            | sed -E 's/.*"token":"([^"]+)".*/\1/')
          if [ -z "$RTOKEN" ]; then
            echo "无法获取 registry token，跳过清理（不影响构建）"
            exit 0
          fi

          TAGS=$(curl -fsSL --max-time 20 -H "Authorization: Bearer $RTOKEN" \
            "https://ghcr.io/v2/${REPO}/tags/list" \
            | sed -E 's/.*"tags":\[//; s/\].*//' | tr -d '"' | tr ',' '\n')

          for TAG in $TAGS; do
            [ -z "$TAG" ] && continue
            [ "$TAG" = "6" ] && continue
            [ "$TAG" = "$CURRENT" ] && continue
            # 只删预发布 tag：版本号里含非数字字符（rc/beta/alpha 等）
            echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+' || continue
            echo "$TAG" | grep -qE '[^0-9.]' || continue

            # 取 manifest 的 digest（多架构 index）
            DIGEST=$(curl -fsSL --max-time 20 -H "Authorization: Bearer $RTOKEN" \
              -I -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/${REPO}/manifests/${TAG}" 2>/dev/null \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')

            if [ -z "$DIGEST" ]; then
              echo "  跳过 $TAG：拿不到 digest"
              continue
            fi

            CODE=$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $RTOKEN" \
              "https://ghcr.io/v2/${REPO}/manifests/${DIGEST}")
            if [ "$CODE" = "202" ] || [ "$CODE" = "200" ]; then
              echo "  已删除预发布 tag: $TAG ($DIGEST)"
            else
              echo "  删除 $TAG 失败（HTTP $CODE），继续"
            fi
          done

      # 构建完成后把官方更新说明发到 GitHub Releases（同一版本已发过则跳过）
      - name: 发布 GitHub Release
        if: github.event_name != 'schedule' || steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          V="${{ steps.version.outputs.version }}"
          TAG="snell-v$V"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过"
            exit 0
          fi
          NOTES_URL="https://kb.nssurge.com/surge-knowledge-base/release-notes/snell.md"
          RAW=$(curl -fsSL --max-time 20 "$NOTES_URL")
          # 从官方 release notes 切出该版本的小节；RC 版本切不到时回退到基线版本小节
          extract() {
            echo "$RAW" | awk -v h="### v$1" '
              $0 == h {p=1; next}
              p && /^### / {exit}
              p {print}'
          }
          SECTION=$(extract "$V"); USED="$V"
          if [ -z "$SECTION" ]; then
            BASE=$(echo "$V" | sed -E 's/[^0-9.].*//')
            if [ "$BASE" != "$V" ]; then SECTION=$(extract "$BASE"); USED="$BASE"; fi
          fi
          OFFICIAL_PAGE="${NOTES_URL%.md}"
          if [ -n "$SECTION" ]; then
            BODY="Docker 镜像 ghcr.io/x-ww/snell:${V} 已构建推送。

          ## 官方更新说明（v${USED}）

          ${SECTION}

          ---
          官方原文：${OFFICIAL_PAGE}"
          else
            BODY="Docker 镜像 ghcr.io/x-ww/snell:${V} 已构建推送。

          官方 release notes 中暂无 v${V} 的单独说明，详见官方原文：${OFFICIAL_PAGE}"
          fi
          gh release create "$TAG" --title "Snell v${V}" --notes "$BODY"
          echo "已创建 Release $TAG"
